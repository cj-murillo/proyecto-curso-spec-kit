[project]
name = "proyecto-curso-speckit"
version = "0.1.0"
description = "Control de gastos personales — reconstruido con Spec-Driven Development"
authors = [
    { name = "Jordan Murillo", email = "jordan.murillo@cedia.org.ec" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "bcrypt<4.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "mcp[cli]<2",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "app/mcp/server.py",
    "app/mcp/auth.py",
    "app/logging_config.py",
]

[tool.coverage.report]
# Artículo VII.3: umbral global del conjunto services+repositories+routers+utils.
# El umbral de services/ (>=90%) se sigue verificando por lectura del reporte
# --cov-report=term-missing, no lo puede expresar coverage.py a nivel de paquete.
fail_under = 80
